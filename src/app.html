<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preload" href="%sveltekit.assets%/font/switzer.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/font/rowan.woff2" as="font" type="font/woff2" crossorigin />

		<!--
			Social metadata lives here rather than in a layout because article pages are rendered in the browser:
			link-preview crawlers don't run JavaScript, so every page shares these generic tags.
		-->
		<meta name="description" content="Lemma is a private, fast, and beautifully designed Wikipedia reader for exploring knowledge without the noise." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Lemma" />
		<meta property="og:title" content="Lemma — A better way to read Wikipedia" />
		<meta property="og:description" content="Lemma is a private, fast, and beautifully designed Wikipedia reader for exploring knowledge without the noise." />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Lemma — Explore knowledge without the noise" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Lemma — A better way to read Wikipedia" />
		<meta name="twitter:description" content="Lemma is a private, fast, and beautifully designed Wikipedia reader for exploring knowledge without the noise." />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta name="twitter:image:alt" content="Lemma — Explore knowledge without the noise" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

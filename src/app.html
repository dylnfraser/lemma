<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preload" href="%sveltekit.assets%/font/switzer.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/font/rowan.woff2" as="font" type="font/woff2" crossorigin />

		<!--
			Social metadata lives here rather than in a layout because article pages are rendered in the browser:
			link-preview crawlers don't run JavaScript, so every page shares these generic tags.
		-->
		<meta name="description" content="Lemma is a private, fast, and beautifully designed Wikipedia reader for exploring knowledge without the noise." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Lemma" />
		<meta property="og:title" content="Lemma" />
		<meta property="og:description" content="Lemma is a private, fast, and beautifully designed Wikipedia reader for exploring knowledge without the noise." />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Lemma — Explore knowledge without the noise" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Lemma" />
		<meta name="twitter:description" content="Lemma is a private, fast, and beautifully designed Wikipedia reader for exploring knowledge without the noise." />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta name="twitter:image:alt" content="Lemma — Explore knowledge without the noise" />
		<!--
			Reader settings (src/lib/settings.svelte.ts), applied before the first paint so a dark or sepia page never
			flashes light. Kept to the stored key and the attributes app.css reads.
		-->
		<script>
			(function () {
				var s = {};
				try { s = JSON.parse(localStorage.getItem("lemma:settings:v1")) || {}; } catch (e) {}
				var root = document.documentElement;
				var theme = ["light", "sepia", "dark"].indexOf(s.theme) >= 0 ? s.theme : "system";
				var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				root.dataset.theme = theme;
				root.dataset.scheme = dark ? "dark" : "light";
				root.dataset.font = s.font === "serif" ? "serif" : "sans";
				root.dataset.width = s.width === "narrow" || s.width === "wide" ? s.width : "normal";
				var sizes = [0.9, 1, 1.1, 1.2, 1.32];
				root.style.setProperty("--text-scale", String(sizes[s.textSize] || 1));
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
